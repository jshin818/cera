[package]
name = "vault-server"
description = "Local HTTP shell: serves the Vault UI and a JSON API over vault-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vault-core.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["macros", "multipart"] }
tokio = { workspace = true, features = ["fs"] }
tower-http.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rand.workspace = true
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
parking_lot.workspace = true
# Answer models: HTTPS to the Claude API, plain HTTP to a local server. rustls is reqwest's default TLS.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "stream", "json"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
