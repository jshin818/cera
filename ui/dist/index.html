<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cera</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply the saved theme before first paint (no flash).
  try { const t = localStorage.getItem('cera.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch {}
  try { const s = JSON.parse(localStorage.getItem('cera.settings') || '{}'), r = document.documentElement.style;
    if (s.size) r.setProperty('--ed-size', { small: '15px', large: '18px' }[s.size] || '16px');
    if (s.width) r.setProperty('--page-w', { narrow: '620px', wide: '880px' }[s.width] || '720px') } catch {}
</script>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Notes">
    <div class="side-head">
      <button class="brand" id="brand" aria-label="Home"><span data-logo="22"></span><span id="wordmark">cēra</span></button>
      <button class="icon" id="find" aria-label="Search" title="Search (⌘K)"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="icon" id="new" aria-label="New note" title="New note (⌘N)"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="icon" id="f-add" aria-label="New folder" title="New folder"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 10.5v5M9.5 13h5"/></svg></button>
      <button class="icon" id="close-side" aria-label="Hide sidebar" title="Hide sidebar (⌘\)"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </div>
    <div class="side-tabs" role="tablist" aria-label="Sidebar view"><button id="tab-notes" role="tab">Notes</button><button id="tab-explore" role="tab">Explore</button></div>
    <div id="side-scroll">
      <div id="notes-pane">
        <div id="f-list" role="tree" aria-label="Folders and notes"></div>
      </div>
      <nav id="ex-nav" hidden></nav>
    </div>
    <div id="side-foot">
      <button class="foot-btn" id="settings-btn" aria-label="Settings" title="Settings (⌘,)"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
      <span id="index-state"></span>
    </div>
  </aside>
  <div id="scrim" hidden></div>
  <main id="main">
    <div id="top">
      <button class="icon" id="open-side" aria-label="Show sidebar" title="Show sidebar (⌘\)" hidden><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <button id="crumb" aria-label="Move note to a folder" title="Move to folder" hidden></button>
      <div id="tabs" role="tablist" hidden></div>
      <div class="grow"></div>
      <span id="status" aria-live="polite"></span>
      <button class="txt-btn" id="graph-btn" title="Graph of this note (⌘G)" hidden><svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="10" cy="18" r="2.5"/><path d="M8.2 7.1 15.6 7.6M7.2 8.2 9.3 15.6M16.6 10.1 11.7 16.3"/></svg><span>Graph</span></button>
      <button class="icon" id="more" aria-label="More actions" title="More" hidden><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      <button class="icon" id="theme-btn"></button>
    </div>
    <div id="scroll">
      <section id="home" hidden>
        <div class="home-logo"><span data-logo="40"></span></div>
        <h1>What's on your mind?</h1>
        <div class="composer">
          <textarea id="capture" rows="1" placeholder="Write, find or jump to anything" aria-label="Write, find or jump to anything"></textarea>
          <button id="send" aria-label="Create note" title="Create note (↵)" disabled><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </div>
        <div id="matches"></div>
      </section>
      <section id="explore" hidden></section>
      <article id="page" hidden>
        <textarea id="title" rows="1" placeholder="Untitled" aria-label="Note title" spellcheck="false"></textarea>
        <div id="meta"></div>
        <div id="tags"><span id="tag-chips"></span><input id="tag-in" placeholder="Add tag" aria-label="Add a tag" autocomplete="off" maxlength="40"></div>
        <div id="dupe" hidden></div>
        <div id="ed" class="prose"></div>
        <section id="below" hidden>
          <div id="links-wrap" hidden><h2>Linked from</h2><div id="back"></div></div>
          <div id="mentions-wrap" hidden><h2>Mentioned in</h2><div id="mentions"></div></div>
          <div id="rel-wrap" hidden><h2>Related</h2><div id="rel"></div></div>
          <div id="sug-wrap" hidden><h2>Suggested links</h2><div id="sug"></div></div>
        </section>
      </article>
    </div>
  </main>
</div>
<div id="move" class="pop" hidden></div>
<div id="tagsug" class="pop" hidden></div>
<div id="fmenu" class="pop" hidden>
  <button class="row" id="fm-note">New note here</button>
  <button class="row" id="fm-sub">New subfolder</button>
  <button class="row" id="fm-rename">Rename</button>
  <button class="row danger" id="fm-del">Move to trash</button>
</div>
<div id="menu" class="pop" hidden>
  <button class="row" id="m-copy">Copy as Markdown</button>
  <button class="row" id="m-path">Copy path</button>
  <button class="row" id="m-dup">Duplicate</button>
  <button class="row" id="m-reveal">Show in graph</button>
  <button class="row danger" id="m-del">Move to trash</button>
</div>
<div id="veil" hidden>
  <div id="pal" class="pop" role="dialog" aria-label="Search">
    <div class="pal-input"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Find a note, search text, or type > for commands" aria-label="Search" autocomplete="off" spellcheck="false"></div>
    <div id="res" role="listbox"></div>
    <div class="pal-foot"><span id="stat"></span><span>↑↓ move · ↵ open · ⌘↵ new tab · esc close</span></div>
  </div>
</div>
<div id="settings-veil" class="veil" hidden>
  <div id="settings" class="pop" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <header><h2 id="settings-title">Settings</h2><button class="icon" id="settings-close" aria-label="Close settings" title="Close (esc)"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div id="settings-body"></div>
  </div>
</div>
<div id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
