[package]
name = "vault-app"
description = "Cēra desktop app: a Tauri 2 window over the local vault-server (macOS first)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "cera"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vault-server = { path = "../vault-server" }
tauri = { version = "2", features = [] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
rfd = "0.17"
serde_json = "1"
anyhow = "1"

[package.metadata.bundle]
name = "Cera"
identifier = "app.cera.vault"
icon = ["icons/icon.png", "icons/icon@2x.png"]
category = "public.app-category.productivity"
short_description = "Fast, local-first Markdown notes"
osx_minimum_system_version = "13.0"
